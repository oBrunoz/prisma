# monta a imagem da api a cada push em api/ e publica no GitHub (ghcr.io)
# x86 e ARM: a mesma imagem serve na micro e na A1 da Oracle
name: imagem da api

on:
  push:
    branches: [master]
    paths: ['api/**', '.github/workflows/api-imagem.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/obrunoz/prisma-api:latest
            ghcr.io/obrunoz/prisma-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/oBrunoz/prisma
          cache-from: type=gha
          cache-to: type=gha,mode=max
