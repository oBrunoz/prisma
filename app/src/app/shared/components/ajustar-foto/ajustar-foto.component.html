<div
  class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4 md:p-8"
  (click)="fechar()">

  <div
    role="dialog"
    aria-modal="true"
    aria-labelledby="ajustar-foto-titulo"
    class="relative w-full sm:max-w-md max-h-[92svh] flex flex-col rounded-t-2xl sm:rounded-2xl bg-[#1a1a1a] border border-white/10 border-b-0 sm:border-b shadow-2xl pb-[env(safe-area-inset-bottom)]"
    (click)="$event.stopPropagation()">

    <div class="flex items-center justify-between gap-4 pl-5 sm:pl-6 pr-3 py-3 border-b border-white/5">
      <h2 id="ajustar-foto-titulo" class="text-base font-semibold text-white">Ajustar foto</h2>
      <button
        type="button"
        (click)="fechar()"
        [disabled]="enviando()"
        class="w-11 h-11 shrink-0 flex items-center justify-center rounded-full text-gray-300 hover:bg-white/10 hover:text-white transition duration-300 cursor-pointer disabled:opacity-40"
        aria-label="Fechar">
        <svg lucideX [size]="18" strokeWidth="2"></svg>
      </button>
    </div>

    <!-- sem data-lenis-prevent o smooth scroll global engole a rolagem daqui -->
    <div data-lenis-prevent class="flex-1 min-h-0 overflow-y-auto px-5 sm:px-6 py-5 space-y-4">
      <canvas
        #palco
        tabindex="0"
        (pointerdown)="aoTocar($event)"
        (pointermove)="aoMover($event)"
        (pointerup)="aoSoltar($event)"
        (pointercancel)="aoSoltar($event)"
        (wheel)="aoRolar($event)"
        (keydown)="aoTeclar($event)"
        aria-label="Enquadramento da foto. Arraste para mover; setas também movem, + e - aproximam."
        class="block w-full max-w-[22rem] mx-auto aspect-square rounded-xl bg-[#0d0d0d] touch-none focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
        [class]="!pronta() ? 'skeleton' : arrastando() ? 'cursor-grabbing' : 'cursor-grab'">
      </canvas>

      <div class="flex items-center gap-3 text-gray-400">
        <button
          type="button"
          (click)="aproximar(zoom() / 1.25)"
          [disabled]="!pronta() || zoom() <= 1"
          class="w-11 h-11 -mx-2 shrink-0 flex items-center justify-center rounded-full hover:text-white transition duration-300 cursor-pointer disabled:opacity-40 disabled:cursor-default"
          aria-label="Afastar">
          <svg lucideZoomOut [size]="18" strokeWidth="2"></svg>
        </button>
        <input
          type="range"
          min="1"
          [max]="zoomMaximo"
          step="0.01"
          [value]="zoom()"
          (input)="aproximar(+$any($event.target).value)"
          [disabled]="!pronta()"
          class="controle-faixa"
          aria-label="Aproximar" />
        <button
          type="button"
          (click)="aproximar(zoom() * 1.25)"
          [disabled]="!pronta() || zoom() >= zoomMaximo"
          class="w-11 h-11 -mx-2 shrink-0 flex items-center justify-center rounded-full hover:text-white transition duration-300 cursor-pointer disabled:opacity-40 disabled:cursor-default"
          aria-label="Aproximar mais">
          <svg lucideZoomIn [size]="18" strokeWidth="2"></svg>
        </button>
        <button
          type="button"
          (click)="girar()"
          [disabled]="!pronta()"
          class="ml-2 w-11 h-11 shrink-0 flex items-center justify-center rounded-full bg-white/10 text-white hover:bg-white/20 transition duration-300 cursor-pointer disabled:opacity-40"
          aria-label="Girar 90 graus">
          <svg lucideRotateCw [size]="18" strokeWidth="2"></svg>
        </button>
      </div>

      <div class="flex items-end gap-5">
        @for (previa of previas; track previa.lado) {
          <figure class="flex flex-col items-center gap-1.5" aria-hidden="true">
            <canvas
              #previa
              class="block rounded-full bg-[#0d0d0d]"
              [style.width.px]="previa.lado"
              [style.height.px]="previa.lado"></canvas>
            <figcaption class="text-xs text-gray-500">{{ previa.rotulo }}</figcaption>
          </figure>
        }
        <label
          class="ml-auto -mr-2 px-2 py-3 text-sm text-gray-400 hover:text-white transition duration-300 cursor-pointer has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-red-500 rounded-lg"
          [class.pointer-events-none]="enviando()">
          <input
            type="file"
            class="sr-only"
            [accept]="tiposDeFoto"
            [disabled]="enviando()"
            (change)="trocarArquivo($any($event.target))" />
          Outra foto
        </label>
      </div>

      @if (erro()) {
        <p class="text-sm text-coral" role="alert">{{ erro() }}</p>
      }
    </div>

    <div class="flex gap-3 px-5 sm:px-6 py-4 border-t border-white/5 sm:justify-end">
      <button
        type="button"
        (click)="fechar()"
        [disabled]="enviando()"
        class="flex-1 sm:flex-none justify-center px-6 py-3 rounded-full transition duration-300 flex items-center text-sm font-medium bg-white/10 hover:bg-white/20 text-white cursor-pointer disabled:opacity-40">
        Cancelar
      </button>
      <button
        type="button"
        (click)="usar()"
        [disabled]="!pronta() || enviando()"
        class="flex-1 sm:flex-none justify-center px-6 py-3 rounded-full transition duration-300 flex items-center text-sm font-medium bg-red-600 hover:bg-red-700 text-white cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-red-600">
        {{ enviando() ? 'Enviando...' : 'Usar foto' }}
      </button>
    </div>
  </div>
</div>
