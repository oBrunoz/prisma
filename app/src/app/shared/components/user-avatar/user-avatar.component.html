<span class="aureola rounded-full p-[2px] inline-flex shrink-0" [ngClass]="medidas.caixa">
  <span class="rounded-full bg-[#111111] p-[2px] w-full h-full inline-flex">
    @if (src; as src) {
      <img
        [src]="src"
        [alt]="nome"
        class="w-full h-full rounded-full object-cover bg-[#1a1a1a]"
      />
    } @else {
      <span
        class="w-full h-full rounded-full bg-[#1a1a1a] text-white font-semibold flex items-center justify-center select-none"
        [ngClass]="medidas.texto">
        {{ inicial }}
      </span>
    }
  </span>
</span>
