<div class="relative group/row">

  <!-- setas e pontos só com mouse: no toque um botão invisível roubaria o tap do card -->
  <button
    type="button"
    (click)="scrollBy(-1)"
    [class.invisible]="!transborda() || (!loop && !canScrollLeft())"
    class="absolute left-0 top-1/2 -translate-y-1/2 sm:-translate-x-1/2 z-20 w-11 h-11 hidden mouse:flex items-center justify-center rounded-full bg-[#111111]/90 border border-white/10 text-white shadow-lg backdrop-blur-sm transition duration-300 hover:bg-[#1f1f1f] hover:border-white/25 opacity-0 group-hover/row:opacity-100 focus-visible:opacity-100"
    aria-label="Anterior">
    <svg lucideChevronLeft [size]="22" strokeWidth="2"></svg>
  </button>

  <div
    #track
    data-lenis-prevent-horizontal
    (scroll)="updateEdges()"
    [class.track-fade-left]="canScrollLeft() && !canScrollRight()"
    [class.track-fade-right]="canScrollRight() && !canScrollLeft()"
    [class.track-fade-both]="canScrollLeft() && canScrollRight()"
    [class.trilho-sangria]="sangria"
    class="flex gap-4 overflow-x-auto hide-scrollbar snap-x scroll-smooth pb-2">
    <ng-content></ng-content>
  </div>

  <button
    type="button"
    (click)="scrollBy(1)"
    [class.invisible]="!transborda() || (!loop && !canScrollRight())"
    class="absolute right-0 top-1/2 -translate-y-1/2 sm:translate-x-1/2 z-20 w-11 h-11 hidden mouse:flex items-center justify-center rounded-full bg-[#111111]/90 border border-white/10 text-white shadow-lg backdrop-blur-sm transition duration-300 hover:bg-[#1f1f1f] hover:border-white/25 opacity-0 group-hover/row:opacity-100 focus-visible:opacity-100"
    aria-label="Próximo">
    <svg lucideChevronRight [size]="22" strokeWidth="2"></svg>
  </button>

  @if (pageCount() > 1) {
    <div
      class="hidden mouse:flex justify-center gap-2 mt-3 opacity-0 transition-opacity duration-300 group-hover/row:opacity-100 focus-within:opacity-100">
      @for (page of pages(); track $index) {
        <button
          type="button"
          (click)="goToPage($index)"
          class="h-2 rounded-full bg-white transition-all duration-300"
          [class.w-5]="currentPage() === $index"
          [class.w-2]="currentPage() !== $index"
          [class.opacity-100]="currentPage() === $index"
          [class.opacity-40]="currentPage() !== $index"
          [attr.aria-current]="currentPage() === $index"
          [attr.aria-label]="'Página ' + ($index + 1)">
        </button>
      }
    </div>
  }

</div>
