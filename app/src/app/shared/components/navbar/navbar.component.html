<!-- NAV -->
<nav
  class="fixed top-0 left-0 right-0 z-50 h-16 px-3 sm:px-6 grid grid-cols-[1fr_auto_1fr] items-center transition-colors duration-300"
  [ngClass]="isScrolled() ? 'bg-[#111111]/90 backdrop-blur-md border-b border-white/5' : ''">

  <div
    class="progress-track absolute bottom-0 left-0 right-0 z-[60] h-[3px] overflow-hidden pointer-events-none transition-opacity duration-300"
    [class.progress-track--solid]="isScrolled()"
    [class.opacity-0]="!loading.visible()"
    [class.opacity-100]="loading.visible()">
    <div
      class="progress-bar h-full origin-left"
      [class.progress-bar--beam]="!isScrolled()"
      [style.width.%]="loading.progress()">
      <span class="progress-head"></span>
    </div>
  </div>

  <!-- Navegação -->
  <div class="flex items-center gap-0.5 sm:gap-1 min-w-0 z-50">

    <!-- Hamburguer (abaixo de md) -->
    <button
      (click)="toggleSidebar()"
      class="hamburger md:hidden relative w-10 h-10 cursor-pointer flex items-center justify-center opacity-60 hover:opacity-100 transition-opacity duration-200"
      [class.active]="sidebarOpen()"
      [attr.aria-expanded]="sidebarOpen()"
      aria-label="Menu">
      <svg viewBox="0 0 32 32" class="h-7 w-7 text-white">
        <path class="line line-top-bottom"
          d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"
          stroke="#ffffff" fill="none" stroke-width="2" stroke-linecap="round" />
        <path class="line" d="M7 16 27 16" stroke="#ffffff" fill="none" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>

    <a routerLink="/" (click)="scrollToTop()" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item hidden md:flex px-2.5 sm:px-3 lg:px-4 py-2 rounded-full text-xs sm:text-sm font-medium text-gray-400 hover:text-white hover:bg-white/10 transition duration-300">
      Home
    </a>
    <a routerLink="/movies" routerLinkActive="is-active"
      class="nav-item hidden md:flex px-2.5 sm:px-3 lg:px-4 py-2 rounded-full text-xs sm:text-sm font-medium text-gray-400 hover:text-white hover:bg-white/10 transition duration-300">
      Filmes
    </a>
    <a routerLink="/series" routerLinkActive="is-active"
      class="nav-item hidden md:flex px-2.5 sm:px-3 lg:px-4 py-2 rounded-full text-xs sm:text-sm font-medium text-gray-400 hover:text-white hover:bg-white/10 transition duration-300">
      Séries
    </a>
  </div>

  <!-- Logo — no celular só a janela, para não disputar espaço com a busca -->
  <a routerLink="/" (click)="scrollToTop()" aria-label="Prisma — início"
    class="z-40 flex items-center justify-center px-2 sm:px-4">
    <span class="flex h-10 sm:hidden"><app-logo variant="mark" [intro]="true" class="h-full"></app-logo></span>
    <span class="hidden sm:flex h-9 lg:h-11"><app-logo variant="horizontal" [intro]="true" class="h-full"></app-logo></span>
  </a>

  <!-- Busca + conta -->
  <div class="flex items-center justify-end gap-1 sm:gap-3 min-w-0 z-50">

    <!-- abaixo de xl a busca fica atrás do ícone e abre como uma barra sobre a navbar -->
    <button
      type="button"
      (click)="abrirBusca()"
      [attr.aria-expanded]="buscaAberta()"
      aria-label="Buscar"
      class="xl:hidden shrink-0 w-10 h-10 flex items-center justify-center rounded-full text-gray-300 hover:text-white hover:bg-white/10 transition duration-300 cursor-pointer">
      <svg lucideSearch [size]="20" strokeWidth="2"></svg>
    </button>

    <!-- Search -->
    <div class="busca" [class.aberta]="buscaAberta()">
    <app-busca
      #busca
      (recolher)="buscaAberta.set(false)"
      class="relative block flex-1 min-w-0 max-w-2xl xl:max-w-none">
    </app-busca>

      <button
        type="button"
        (mousedown)="$event.preventDefault()"
        (click)="fecharBusca()"
        class="xl:hidden shrink-0 px-1 py-2 text-sm text-gray-400 hover:text-white transition duration-300 cursor-pointer">
        Cancelar
      </button>
    </div>

    <!-- Conta -->
    @if (auth.autenticado()) {
      <div
        data-menu-conta
        class="hidden md:block relative">

        <button
          type="button"
          (click)="alternarMenuConta()"
          [attr.aria-expanded]="menuContaAberto()"
          aria-haspopup="menu"
          [attr.aria-label]="'Conta de ' + (auth.usuario()?.username ?? '')"
          class="flex items-center cursor-pointer rounded-full focus:outline-none focus-visible:ring-2 focus-visible:ring-white/40">
          <app-user-avatar
            [nome]="auth.usuario()?.username ?? ''"
            [avatarUrl]="auth.usuario()?.avatarUrl ?? null"
            tamanho="sm">
          </app-user-avatar>
        </button>

        <div
          class="absolute top-full right-0 pt-3 z-40"
          [class.pointer-events-none]="!menuContaAberto()">
          <div
            role="menu"
            class="dropdown-panel w-64 bg-[#1a1a1a] shadow-2xl rounded-2xl text-white border border-white/10 overflow-hidden"
            [class.is-open]="menuContaAberto()">

          <div class="flex items-center gap-3 px-4 py-4 border-b border-white/5">
            <app-user-avatar
              [nome]="auth.usuario()?.username ?? ''"
              [avatarUrl]="auth.usuario()?.avatarUrl ?? null"
              tamanho="md">
            </app-user-avatar>
            <div class="min-w-0">
              <p class="text-sm font-semibold truncate">{{ auth.usuario()?.username }}</p>
            </div>
          </div>

          <div class="p-2">
            <a
              routerLink="/perfil"
              role="menuitem"
              (click)="fecharMenuConta()"
              class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-300 hover:text-white hover:bg-white/10 transition duration-300">
              <svg lucideUser [size]="16" strokeWidth="2"></svg>
              Meu perfil
            </a>
            <a
              routerLink="/configuracoes"
              role="menuitem"
              (click)="fecharMenuConta()"
              class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-300 hover:text-white hover:bg-white/10 transition duration-300">
              <svg lucideSettings [size]="16" strokeWidth="2"></svg>
              Configurações
            </a>
            <button
              type="button"
              role="menuitem"
              (click)="sair()"
              class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-300 hover:text-white hover:bg-white/10 transition duration-300 cursor-pointer">
              <svg lucideLogOut [size]="16" strokeWidth="2"></svg>
              Sair
            </button>
          </div>
          </div>
        </div>
      </div>
    } @else {
      <a routerLink="/login"
        class="hidden md:flex px-3 lg:px-5 py-2 rounded-full text-sm font-medium text-gray-400 hover:text-white transition duration-300 whitespace-nowrap">
        Entrar
      </a>
      <a routerLink="/register"
        class="hidden md:flex px-4 lg:px-6 py-2.5 rounded-full text-sm font-medium text-white bg-red-600 hover:bg-red-700 transition duration-300 items-center whitespace-nowrap">
        Cadastrar
      </a>
    }
  </div>
</nav>

<!-- Sidebar (abaixo de md): fora do <nav>, cujo backdrop-blur prenderia os fixed à altura dele -->
<div
  class="md:hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[55] transition-opacity duration-300"
  [class.opacity-0]="!sidebarOpen()"
  [class.pointer-events-none]="!sidebarOpen()"
  [class.opacity-100]="sidebarOpen()"
  (click)="closeSidebar()">
</div>

<aside
  class="md:hidden fixed top-0 left-0 h-full w-72 max-w-[80vw] z-[56] flex flex-col bg-[#0d0d0d]/95 backdrop-blur-xl border-r border-white/5 transition-transform duration-300 ease-in-out"
  [class.-translate-x-full]="!sidebarOpen()"
  [class.translate-x-0]="sidebarOpen()">

  <div class="flex items-center justify-between px-6 h-16">
    <app-logo class="h-8"></app-logo>
    <button
      (click)="closeSidebar()"
      class="w-9 h-9 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-gray-400 hover:text-white transition duration-300"
      aria-label="Fechar menu">
      <svg lucideX [size]="16" strokeWidth="2"></svg>
    </button>
  </div>

  <nav data-lenis-prevent class="flex-1 px-6 pt-4 overflow-y-auto space-y-1">
    <a routerLink="/" (click)="closeSidebar(); scrollToTop()"
      routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item flex items-center px-4 py-3 rounded-full text-sm font-medium text-gray-400 hover:text-white hover:bg-white/10 transition duration-300">
      Home
    </a>
    <a routerLink="/movies" (click)="closeSidebar()" routerLinkActive="is-active"
      class="nav-item flex items-center px-4 py-3 rounded-full text-sm font-medium text-gray-400 hover:text-white hover:bg-white/10 transition duration-300">
      Filmes
    </a>
    <a routerLink="/series" (click)="closeSidebar()" routerLinkActive="is-active"
      class="nav-item flex items-center px-4 py-3 rounded-full text-sm font-medium text-gray-400 hover:text-white hover:bg-white/10 transition duration-300">
      Séries
    </a>
  </nav>

  <div class="px-6 pt-6 pb-[max(2rem,env(safe-area-inset-bottom))] space-y-3">
    @if (auth.autenticado()) {
      <a routerLink="/perfil" (click)="closeSidebar()"
        class="flex items-center gap-3 px-2 pb-3 transition duration-300 group/conta">
        <app-user-avatar
          [nome]="auth.usuario()?.username ?? ''"
          [avatarUrl]="auth.usuario()?.avatarUrl ?? null"
          tamanho="sm">
        </app-user-avatar>
        <span class="min-w-0">
          <span class="block text-sm font-medium text-white truncate group-hover/conta:text-red-500 transition duration-300">
            {{ auth.usuario()?.username }}
          </span>
        </span>
      </a>
      <a routerLink="/configuracoes" (click)="closeSidebar()"
        class="w-full px-6 py-3 rounded-full transition duration-300 flex items-center justify-center text-sm font-medium text-white bg-white/10 hover:bg-white/20">
        Configurações
      </a>
      <button type="button" (click)="sair()"
        class="w-full px-6 py-3 rounded-full transition duration-300 flex items-center justify-center text-sm font-medium text-white bg-white/10 hover:bg-white/20 cursor-pointer">
        Sair
      </button>
    } @else {
      <a routerLink="/register" (click)="closeSidebar()"
        class="w-full px-6 py-3 rounded-full transition duration-300 flex items-center justify-center text-sm font-medium text-white bg-red-600 hover:bg-red-700">
        Cadastrar
      </a>
      <a routerLink="/login" (click)="closeSidebar()"
        class="w-full px-6 py-3 rounded-full transition duration-300 flex items-center justify-center text-sm font-medium text-white bg-white/10 hover:bg-white/20">
        Entrar
      </a>
    }
  </div>
</aside>
