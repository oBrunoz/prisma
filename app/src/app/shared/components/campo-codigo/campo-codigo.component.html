<div class="flex gap-2" role="group" aria-label="Código de confirmação" [attr.aria-describedby]="descricao">
  @for (i of indices; track i) {
    <input
      #casa
      type="text"
      inputmode="numeric"
      [attr.autocomplete]="i === 0 ? 'one-time-code' : 'off'"
      [attr.aria-label]="'Dígito ' + (i + 1)"
      [attr.aria-invalid]="invalido"
      [value]="digito(i)"
      [disabled]="desativado"
      (input)="aoDigitar(i, $event)"
      (keydown)="aoTeclar(i, $event)"
      (focus)="$any($event.target).select()"
      [class.ring-1]="invalido"
      [class.ring-coral]="invalido"
      class="w-11 h-14 sm:w-12 rounded-lg bg-[#111111] text-center text-2xl font-semibold text-white tabular-nums focus:outline-none focus:ring-2 focus:ring-red-500 disabled:opacity-60"
    />
  }
</div>
