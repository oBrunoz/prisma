<!-- as ações ficam fora do link: botão dentro de <a> é HTML inválido e o clique abriria o filme -->
<div class="group relative">
  <a
    [routerLink]="detailsRoute"
    (appSegurar)="abrirFolha()"
    class="block relative aspect-[2/3] rounded-lg overflow-hidden bg-[#1a1a1a] select-none [-webkit-touch-callout:none]">
    @if (posterUrl) {
      <img [src]="posterUrl" alt="" class="object-cover w-full h-full" loading="lazy" draggable="false" />
    } @else {
      <app-media-fallback [label]="title"></app-media-fallback>
    }

    <app-selo-marcas
      [tmdbId]="id"
      [tipo]="tipo"
      class="absolute top-2 left-2 transition duration-300 mouse:group-hover:opacity-0 mouse:group-focus-within:opacity-0">
    </app-selo-marcas>

    @if (rating > 0) {
      <span class="absolute top-2 right-2 flex items-center gap-1 rounded bg-[#111111]/80 px-1.5 py-0.5 text-[11px] font-semibold text-yellow-400 tabular-nums">
        <svg lucideStar [size]="11" strokeWidth="2" fill="currentColor"></svg>
        {{ rating | number: '1.1-1' }}
      </span>
    }

    <span class="veu absolute inset-0 pointer-events-none transition duration-300" aria-hidden="true"></span>

    <span class="legenda absolute inset-x-0 bottom-0 p-3 toque:pr-11 mouse:pb-14 transition duration-300">
      <span class="block text-white font-semibold text-sm truncate">{{ title }}</span>
      @if (year) {
        <span class="block text-gray-300 text-xs tabular-nums mt-0.5">{{ year }}</span>
      }
    </span>
  </a>

  <app-acoes-card
    [tmdbId]="id"
    [tipo]="tipo"
    [titulo]="title"
    class="absolute left-3 bottom-3 hidden mouse:block opacity-0 translate-y-2 transition duration-300 group-hover:opacity-100 group-hover:translate-y-0 group-focus-within:opacity-100 group-focus-within:translate-y-0">
  </app-acoes-card>

  <!-- 44px de alvo, 32px de desenho -->
  <button
    type="button"
    (click)="abrirFolha()"
    [attr.aria-label]="'Ações para ' + title"
    class="absolute right-0 bottom-0 w-11 h-11 rounded-full flex mouse:hidden items-center justify-center cursor-pointer">
    <span class="w-8 h-8 rounded-full bg-[#111111]/80 text-white flex items-center justify-center">
      <svg lucideEllipsis [size]="16" strokeWidth="2.2"></svg>
    </span>
  </button>
</div>
