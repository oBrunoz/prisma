<article class="w-full max-w-[680px] mx-auto rounded-2xl bg-[#1a1a1a] overflow-hidden shadow-2xl shadow-black/40">
  <header class="flex justify-between items-baseline gap-3 px-5 pt-4 pb-3.5 border-b-2 border-dashed border-white/[0.08]">
    <h2 class="text-[15px] font-semibold text-white">{{ titulo }}</h2>
    @if (legenda) {
      <span class="font-mono text-xs text-gray-500">{{ legenda }}</span>
    }
  </header>
  <ol class="py-1.5">
    @for (l of linhas; track $index; let i = $index) {
      <li class="linha" [style.--cor]="espectro[i]" [class.aberta]="l.valor !== null" [class.abre]="abrindo().has(i)">
        <div class="grid sm:grid-cols-[132px_minmax(0,1fr)] gap-x-4 gap-y-1 items-baseline min-w-0">
          <span class="text-xs tabular-nums" [class]="l.valor !== null ? 'text-gray-400' : 'text-gray-500'">{{ l.rotulo }}</span>
          @if (l.valor !== null) {
            <span class="valor min-w-0 text-pretty" [class]="destaque ? 'text-lg font-semibold text-white' : 'text-base text-white'">
              {{ l.valor }}
              @if (l.detalhe) {
                <small class="block mt-0.5 text-[13px] font-normal text-gray-400">{{ l.detalhe }}</small>
              }
            </span>
          } @else {
            <i class="block h-3.5 mt-1 max-w-full rounded-[3px] bg-white/[0.07]" [style.width]="larguras[i]" aria-label="Linha fechada"></i>
          }
        </div>
      </li>
    }
  </ol>
</article>
