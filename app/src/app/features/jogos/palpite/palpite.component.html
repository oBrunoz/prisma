<form class="flex flex-wrap sm:flex-nowrap items-center gap-2.5" autocomplete="off" (submit)="enviar($event)">
  <div class="relative flex-1 basis-full sm:basis-auto min-w-0">
    <label
      [class.errou]="errou()"
      (animationend)="errou.set(false)"
      class="caixa flex items-center gap-2.5 h-12 px-5 rounded-full bg-white/5 border border-white/10 focus-within:border-white/30 focus-within:bg-white/[0.07] text-gray-400 transition duration-300">
      <svg lucideSearch [size]="18" strokeWidth="2" class="shrink-0"></svg>
      <input
        #campo
        id="palpite"
        type="text"
        placeholder="Qual é o filme?"
        role="combobox"
        aria-autocomplete="list"
        aria-controls="palpite-opcoes"
        [attr.aria-expanded]="aberta()"
        [disabled]="desabilitado"
        (input)="aoDigitar(campo.value)"
        (keydown)="aoTeclar($event)"
        (blur)="fecharDepois()"
        class="flex-1 min-w-0 bg-transparent text-base sm:text-[15px] text-white placeholder-gray-500 outline-none" />
    </label>

    @if (aberta()) {
      <ul
        id="palpite-opcoes"
        role="listbox"
        data-lenis-prevent
        class="absolute z-30 left-0 right-0 top-[calc(100%+6px)] p-1.5 max-h-72 overflow-y-auto rounded-2xl bg-[#1a1a1a] border border-white/10 shadow-2xl shadow-black/50">
        @for (opcao of opcoes(); track opcao.tmdbId; let i = $index) {
          <li
            role="option"
            [attr.aria-selected]="i === ativa()"
            (mousedown)="$event.preventDefault(); escolher(opcao)"
            (mouseenter)="ativa.set(i)"
            class="flex justify-between gap-3 px-3 py-2.5 rounded-xl cursor-pointer transition duration-150"
            [class]="i === ativa() ? 'bg-white/10 text-white' : 'text-gray-300'">
            <span class="truncate">{{ opcao.title }}</span>
            <span class="shrink-0 text-gray-500 tabular-nums">{{ opcao.year ?? '' }}</span>
          </li>
        } @empty {
          <li class="px-3 py-2.5 text-gray-500">
            {{ buscando() ? 'Procurando…' : 'Nenhum filme com esse nome' }}
          </li>
        }
      </ul>
    }
  </div>

  <button
    type="submit"
    [disabled]="!escolhida() || desabilitado"
    class="flex-1 sm:flex-none px-6 py-3 rounded-full bg-red-600 hover:bg-red-700 disabled:bg-red-600/35 disabled:text-white/60 disabled:cursor-not-allowed text-white text-sm font-medium transition duration-300 flex items-center justify-center cursor-pointer">
    Chutar
  </button>
  <button
    type="button"
    (click)="aoPular()"
    [disabled]="desabilitado"
    class="flex-1 sm:flex-none px-6 py-3 rounded-full bg-white/10 hover:bg-white/20 disabled:opacity-60 text-white text-sm font-medium transition duration-300 flex items-center justify-center gap-2 cursor-pointer">
    <svg lucideSkipForward [size]="16" strokeWidth="2"></svg>
    Pular
  </button>
</form>
