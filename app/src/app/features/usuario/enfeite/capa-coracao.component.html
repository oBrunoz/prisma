<div class="coracao">
  <svg class="fios" viewBox="-10 -10 120 110" aria-hidden="true">
    @for (anel of aneis; track anel.cor) {
      <path
        d="M50 88C20 66 2 48 2 28C2 13 13 2 27 2C38 2 46 9 50 18C54 9 62 2 73 2C87 2 98 13 98 28C98 48 80 66 50 88Z"
        fill="none"
        stroke-linejoin="round"
        [attr.stroke]="anel.cor"
        [attr.stroke-width]="anel.largura"
        [attr.transform]="anel.transform" />
    }
  </svg>

  <svg viewBox="-10 -10 120 110" aria-hidden="true">
    <clipPath id="enf-vao">
      <path
        d="M50 88C20 66 2 48 2 28C2 13 13 2 27 2C38 2 46 9 50 18C54 9 62 2 73 2C87 2 98 13 98 28C98 48 80 66 50 88Z"
        transform="translate(50 46) scale(0.44) translate(-50 -46)" />
    </clipPath>
    <image
      [attr.href]="src()"
      x="28"
      y="25.76"
      width="44"
      height="39.6"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#enf-vao)" />
  </svg>
</div>
