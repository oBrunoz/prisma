<div class="bg-[#111]/90 px-gutter pt-28 sm:pt-32 pb-20 sm:pb-24 lg:grid lg:grid-cols-[13rem_minmax(0,1fr)] xl:grid-cols-[15rem_minmax(0,1fr)] lg:gap-x-16 xl:gap-x-24">
  <header class="max-w-[68ch] lg:col-start-2 lg:row-start-1">
    <h1 class="text-3xl sm:text-4xl font-bold text-white">{{ titulo() }}</h1>
    @if (apoio()) {
      <p class="mt-3 text-sm text-gray-400">{{ apoio() }}</p>
    }
  </header>

  <!-- no celular a lista abre por cima do texto (absolute): crescendo no fluxo, empurraria a página presa -->
  <nav
    aria-label="Nesta página"
    class="sticky top-16 z-30 -mx-gutter px-gutter py-2 mt-6 bg-[#111] lg:mx-0 lg:px-0 lg:py-0 lg:mt-1 lg:bg-transparent lg:z-auto lg:col-start-1 lg:row-start-1 lg:row-span-2 lg:top-28 lg:self-start">
    <button
      type="button"
      (click)="indiceAberto.set(!indiceAberto())"
      [attr.aria-expanded]="indiceAberto()"
      aria-controls="indice-legal"
      class="lg:hidden w-full max-w-[68ch] h-12 px-4 flex items-center gap-3 rounded-lg bg-[#1a1a1a] text-sm cursor-pointer">
      <span class="text-gray-400 shrink-0">Nesta página</span>
      <span class="flex-1 min-w-0 truncate text-left text-white font-medium">{{ tituloAtual() }}</span>
      <svg lucideChevronDown [size]="18" strokeWidth="1.75" class="shrink-0 text-gray-400 transition-transform duration-300" [class.rotate-180]="indiceAberto()"></svg>
    </button>

    <div
      id="indice-legal"
      data-lenis-prevent
      class="absolute left-gutter right-gutter top-full max-w-[68ch] max-h-[70svh] overflow-y-auto px-2 py-2 rounded-lg bg-[#1a1a1a] shadow-2xl shadow-black/60 lg:static lg:block lg:max-h-none lg:overflow-visible lg:p-0 lg:bg-transparent lg:shadow-none"
      [class.hidden]="!indiceAberto()">
      <p class="hidden lg:block text-sm font-semibold text-white mb-3">Nesta página</p>
      <ol class="lg:border-l lg:border-white/10">
        @for (secao of secoes(); track secao.id) {
          <li>
            <a
              [href]="rota() + '#' + secao.id"
              (click)="irPara(secao.id, $event)"
              [attr.aria-current]="atual() === secao.id ? 'location' : null"
              [class]="atual() === secao.id ? 'text-white font-medium bg-white/5 lg:bg-transparent lg:border-white' : 'text-gray-400 border-transparent'"
              class="block px-2 py-2.5 lg:py-1.5 lg:pl-4 lg:-ml-px lg:border-l-2 rounded-md lg:rounded-none text-sm hover:text-white transition duration-300">
              {{ secao.titulo }}
            </a>
          </li>
        }
      </ol>
      <div class="border-t border-white/5 mt-2 lg:mt-5 pt-2 lg:pt-5 lg:space-y-2">
        @for (outra of outras(); track outra.rota) {
          <a
            [routerLink]="outra.rota"
            class="block px-2 py-2.5 lg:p-0 text-sm text-gray-400 hover:text-white transition duration-300">
            {{ outra.rotulo }}
          </a>
        }
      </div>
    </div>
  </nav>

  <article class="texto-legal min-w-0 max-w-[68ch] mt-8 lg:mt-10 lg:col-start-2 lg:row-start-2">
    <ng-content></ng-content>
  </article>
</div>
