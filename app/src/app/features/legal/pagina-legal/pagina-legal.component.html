<!-- celular: título, índice recolhido e texto; desktop: índice fixo à esquerda -->
<!-- o véu #111 a 90% recua as listras atrás do texto, como na partida dos jogos -->
<div class="bg-[#111]/90 px-gutter pt-28 sm:pt-32 pb-20 sm:pb-24 lg:grid lg:grid-cols-[13rem_minmax(0,1fr)] xl:grid-cols-[15rem_minmax(0,1fr)] lg:gap-x-16 xl:gap-x-24">
  <header class="max-w-[68ch] lg:col-start-2 lg:row-start-1">
    <h1 class="text-3xl sm:text-4xl font-bold text-white">{{ titulo() }}</h1>
    <p class="mt-3 text-sm text-gray-400">Atualizado em {{ atualizadoEm }}</p>
  </header>

  <nav
    aria-label="Nesta página"
    class="mt-8 lg:mt-1 lg:col-start-1 lg:row-start-1 lg:row-span-2 lg:sticky lg:top-28 lg:self-start max-w-[68ch]">
    <button
      type="button"
      (click)="indiceAberto.set(!indiceAberto())"
      [attr.aria-expanded]="indiceAberto()"
      aria-controls="indice-legal"
      class="lg:hidden w-full h-12 px-4 flex items-center justify-between rounded-lg bg-[#1a1a1a] text-white text-sm font-medium cursor-pointer">
      Nesta página
      <svg lucideChevronDown [size]="18" strokeWidth="1.75" class="text-gray-400 transition-transform duration-300" [class.rotate-180]="indiceAberto()"></svg>
    </button>

    <div
      id="indice-legal"
      class="lg:block mt-2 lg:mt-0 px-4 py-2 lg:p-0 rounded-lg bg-[#1a1a1a] lg:bg-transparent"
      [class.hidden]="!indiceAberto()">
      <p class="hidden lg:block text-sm font-semibold text-white mb-3">Nesta página</p>
      <ol>
        @for (secao of secoes(); track secao.id) {
          <li>
            <a
              [href]="rota() + '#' + secao.id"
              (click)="irPara(secao.id, $event)"
              class="block py-2.5 lg:py-1.5 text-sm text-gray-400 hover:text-white transition duration-300">
              {{ secao.titulo }}
            </a>
          </li>
        }
      </ol>
      <div class="border-t border-white/5 mt-2 lg:mt-5 pt-2 lg:pt-5">
        <a
          [routerLink]="outra().rota"
          class="block py-2.5 lg:py-0 text-sm text-gray-400 hover:text-white transition duration-300">
          {{ outra().rotulo }}
        </a>
      </div>
    </div>
  </nav>

  <article class="texto-legal min-w-0 max-w-[68ch] mt-10 lg:mt-10 lg:col-start-2 lg:row-start-2">
    <ng-content></ng-content>
  </article>
</div>
