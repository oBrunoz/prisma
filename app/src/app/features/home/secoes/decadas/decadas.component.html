<section class="px-gutter py-14 sm:py-20 mb-14 sm:mb-20 bg-[#0d0d0d] border-y border-white/5" (appAparecer)="carregar()">
  <h2 class="text-3xl sm:text-4xl md:text-5xl font-bold text-white">Uma década por cor</h2>
  <p class="text-gray-400 mt-4">Do violeta dos anos 60 ao carmim de agora.</p>

  <div class="trilho flex gap-4 lg:gap-3 overflow-x-auto trilho-sangria mt-8 sm:mt-10" data-lenis-prevent-horizontal>
    @if (decadas().length) {
      @for (d of decadas(); track d.inicio) {
        <a
          routerLink="/movies"
          [queryParams]="{ decada: d.inicio }"
          class="decada"
          [style.--cor]="d.cor"
          [attr.aria-label]="'Filmes dos anos ' + rotulo(d.inicio)">
          <div class="p-4 pb-0">
            <span class="block text-4xl xl:text-5xl font-bold text-white tabular-nums tracking-tight">{{ rotulo(d.inicio) }}</span>
            @if (d.total) {
              <span class="block text-xs text-white/70 mt-1 tabular-nums">{{ d.total | number }} filmes</span>
            }
          </div>
          <div class="leque" aria-hidden="true">
            @for (p of d.posters; track p) {
              <img [src]="p" alt="" loading="lazy" />
            }
          </div>
        </a>
      }
    } @else {
      @for (inicio of esqueleto; track inicio) {
        <div class="decada skeleton bg-[#1a1a1a]"></div>
      }
    }
  </div>
</section>
