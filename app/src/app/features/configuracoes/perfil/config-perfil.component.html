<h2 class="text-xl sm:text-2xl font-bold text-white">Perfil</h2>
<p class="mt-1 text-sm text-gray-400">A foto, a bio e a capa aparecem no seu perfil, ao lado do seu nome de usuário.</p>

<div class="mt-8">
  <app-campo-foto></app-campo-foto>
</div>

<form class="mt-8 pt-8 border-t border-white/5 space-y-6" (ngSubmit)="salvar()" novalidate>
  <div>
    <label for="perfil-name" class="block text-sm text-gray-300 mb-2">Nome</label>
    <input
      id="perfil-name"
      type="text"
      [ngModel]="valores.name()"
      (ngModelChange)="editar('name', $event)"
      (blur)="campos.tocar('name')"
      name="name"
      maxlength="80"
      autocomplete="name"
      aria-describedby="ajuda-name"
      [attr.aria-invalid]="!!campos.erro('name')"
      [class.ring-1]="!!campos.erro('name')"
      [class.ring-coral]="!!campos.erro('name')"
      class="w-full bg-[#1a1a1a] text-white placeholder-gray-500 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500"
    />
    <p id="ajuda-name" class="mt-2 text-xs" [class]="campos.erro('name') ? 'text-coral' : 'text-gray-500'">
      {{ campos.erro('name') || 'Fica só na sua conta. No site você aparece pelo nome de usuário.' }}
    </p>
  </div>

  <div>
    <div class="flex items-baseline justify-between mb-2">
      <label for="perfil-bio" class="text-sm text-gray-300">Bio</label>
      <span class="text-xs text-gray-500 tabular-nums" aria-hidden="true">{{ valores.bio().length }}/300</span>
    </div>
    <textarea
      id="perfil-bio"
      [ngModel]="valores.bio()"
      (ngModelChange)="editar('bio', $event)"
      name="bio"
      rows="3"
      maxlength="300"
      [attr.aria-invalid]="!!campos.erro('bio')"
      [attr.aria-describedby]="campos.erro('bio') ? 'erro-bio' : null"
      [class.ring-1]="!!campos.erro('bio')"
      [class.ring-coral]="!!campos.erro('bio')"
      class="w-full bg-[#1a1a1a] text-white placeholder-gray-500 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 resize-y min-h-24 max-h-56"></textarea>
    @if (campos.erro('bio'); as erro) {
      <p id="erro-bio" class="mt-2 text-xs text-coral">{{ erro }}</p>
    }
  </div>

  <button
    type="submit"
    [disabled]="!mudou() || salvando()"
    class="px-6 py-3 rounded-full transition duration-300 flex items-center text-sm font-medium bg-red-600 hover:bg-red-700 text-white cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-red-600">
    {{ salvando() ? 'Salvando...' : 'Salvar perfil' }}
  </button>
</form>

<section class="mt-12 pt-8 border-t border-white/5">
  <app-escolher-capa></app-escolher-capa>
</section>
