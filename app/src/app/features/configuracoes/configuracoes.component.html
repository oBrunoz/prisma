<div class="px-gutter pt-28 sm:pt-32 pb-20 grid gap-8 md:grid-cols-[14rem_minmax(0,1fr)] md:gap-12">
  <nav aria-label="Configurações" class="md:sticky md:top-28 md:self-start">
    <h1 class="text-2xl font-bold text-white mb-4 md:mb-6">Configurações</h1>
    <ul class="flex gap-1 md:flex-col">
      @for (secao of secoes; track secao.caminho) {
        <li>
          <a
            [routerLink]="secao.caminho"
            routerLinkActive="!text-white bg-white/10"
            ariaCurrentWhenActive="page"
            class="block px-3 py-2 rounded-lg text-gray-400 hover:text-white transition duration-300">
            {{ secao.rotulo }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="min-w-0 max-w-xl">
    <router-outlet></router-outlet>
  </div>
</div>
